<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #1e1e1e; color: white; font-family: sans-serif; }
    #video-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    video { background: black; border-radius: 8px; max-width: 300px; }
    video.screen-share { max-width: 800px; width: 100%; border: 2px solid #5865F2; }
    button { padding: 10px; background: #5865F2; color: white; border: none; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <input type="text" id="room-input" placeholder="ID da Sala">
  <button id="join-btn">Entrar</button>
  <button id="share-btn" disabled>Compartilhar Tela</button>

  <div id="video-grid"></div>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
