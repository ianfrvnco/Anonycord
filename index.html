<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self' 'unsafe-inline' https://anonycord-server.onrender.com; 
                 connect-src 'self' https://anonycord-server.onrender.com wss://anonycord-server.onrender.com wss://* https://*; 
                 style-src 'self' 'unsafe-inline'; 
                 media-src 'self' blob:;
                 img-src 'self' data:;">
  <title>AnonyCord</title>
  <style>
    body { 
      background: #000000; 
      color: #ffffff; 
      font-family: sans-serif; 
      padding: 20px; 
    }
    
    .controls { margin-bottom: 20px; }
    
    input, button, select { 
      padding: 8px 12px; 
      margin-right: 8px; 
      font-size: 14px; 
      border-radius: 4px; 
    }
    
    input, select { 
      background: #111111; 
      color: #ffffff; 
      border: 1px solid #fcc203; 
      outline: none; 
    }
    input:focus, select:focus { 
      border-color: #ffe066; 
      box-shadow: 0 0 5px rgba(252, 194, 3, 0.5); 
    }
    
    button { 
      background: #fcc203; 
      color: #000000; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
      transition: background 0.2s; 
    }
    button:hover { 
      background: #e0ac00; 
    }
    button:disabled { 
      background: #333333; 
      color: #777777; 
      cursor: not-allowed; 
    }

    .btn-danger {
      background: #da373c !important;
      color: #ffffff !important;
    }
    .btn-danger:hover {
      background: #a1282b !important;
    }

    .main-container { display: flex; gap: 20px; }
    
    #sidebar { 
      width: 220px; 
      background: #111111; 
      padding: 15px; 
      border-radius: 8px; 
      border: 1px solid #222222; 
    }
    #sidebar h3 { 
      color: #fcc203; 
      margin-top: 0; 
      border-bottom: 1px solid #fcc203; 
      padding-bottom: 8px; 
    }
    
    #user-list { list-style: none; padding: 0; margin-top: 10px; }
    #user-list li { 
      padding: 6px 10px; 
      margin-bottom: 6px; 
      background: #1a1a1a; 
      border-left: 3px solid #fcc203; 
      border-radius: 4px; 
      font-size: 14px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Badges de Estado de Áudio */
    .user-status-badges {
      display: flex;
      gap: 4px;
      font-size: 12px;
    }
    .badge-icon {
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: bold;
    }
    .badge-muted {
      background: #da373c;
      color: #ffffff;
    }
    .badge-deafened {
      background: #7289da;
      color: #ffffff;
    }

    #video-grid { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
    video { 
      width: 400px; 
      height: 250px; 
      background: #080808; 
      border: 2px solid #fcc203; 
      border-radius: 8px; 
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #111111;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #fcc203;
      max-width: 750px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-content h2 { color: #fcc203; margin-top: 0; text-align: center; }

    .option-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .option-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #fcc203;
      font-weight: bold;
    }
    .option-group select {
      width: 100%;
    }
    
    .meter-container {
      background: #1a1a1a;
      border: 1px solid #333333;
      height: 20px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    #mic-meter-fill {
      background: #fcc203;
      height: 100%;
      width: 0%;
      transition: width 0.05s ease-out, background-color 0.1s;
    }

    .sources-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin: 20px 0;
    }
    .source-card {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 200px;
      border: 2px solid #333333;
      transition: border-color 0.2s, transform 0.1s;
    }
    .source-card:hover {
      border-color: #fcc203;
      transform: scale(1.02);
    }
    .source-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 4px;
    }
    .source-card p {
      margin: 8px 0 0 0;
      font-size: 12px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-version {
      position: fixed;
      left: 12px;
      bottom: 10px;
      color: #888888;
      font-size: 12px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="app-version" class="app-version">AnonyCord</div>

  <div class="controls">
    <input type="text" id="username-input" placeholder="Seu Nome (ex: Ian)">
    <input type="text" id="room-input" placeholder="ID da Sala">
    <button id="join-btn">Entrar</button>
    <button id="leave-btn" class="btn-danger" style="display: none;">Sair da Sala</button>
    <button id="share-btn">Compartilhar Tela</button>
    <button id="mute-btn">🎤 Mutar Mic</button>
    <button id="deafen-btn">🎧 Silenciar Tudo</button>
    <button id="options-btn">Opções</button>
  </div>

  <div class="main-container">
    <div id="sidebar">
      <h3>Conectados</h3>
      <ul id="user-list"></ul>
    </div>
    <div id="video-grid"></div>
  </div>

  <!-- Modal de Opções -->
  <div id="options-modal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <h2>Opções e Atalhos</h2>
      
      <div class="option-group">
        <label for="audio-input-select">Entrada de Áudio (Microfone):</label>
        <select id="audio-input-select"></select>
      </div>

      <div class="option-group">
        <label>Sensibilidade do Microfone:</label>
        <div class="meter-container">
          <div id="mic-meter-fill"></div>
        </div>
      </div>

      <div class="option-group">
        <label for="audio-output-select">Saída de Áudio (Alto-falante):</label>
        <select id="audio-output-select"></select>
      </div>

      <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

      <div class="option-group">
        <label>Atalhos de Teclado (Clique para alterar):</label>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-size: 13px;">Mutar Microfone:</span>
          <input type="text" id="shortcut-mute-input" readonly style="width: 160px; text-align: center; cursor: pointer; font-weight: bold;">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 13px;">Silenciar Áudio e Mic:</span>
          <input type="text" id="shortcut-deafen-input" readonly style="width: 160px; text-align: center; cursor: pointer; font-weight: bold;">
        </div>
      </div>

      <div style="text-align: right; margin-top: 25px;">
        <button id="close-options-btn">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal Seletor de Telas -->
  <div id="screen-picker-modal" class="modal">
    <div class="modal-content">
      <h2>Selecione o que deseja compartilhar</h2>
      <div id="sources-grid" class="sources-grid"></div>
      <button id="cancel-picker-btn" class="btn-danger">Cancelar</button>
    </div>
  </div>

  <script src="https://anonycord-server.onrender.com/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
